<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 90" width="350" height="90" fill="none">
  <!-- Icon Container with soft gradient background, increased size from 60x60 to 72x72 -->
  <rect x="6" y="9" width="72" height="72" rx="18" fill="url(#brandGrad)" />
  <rect x="6.5" y="9.5" width="71" height="71" rx="17.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
  
  <!-- Architectural/Roommate Building & Shared Space Icon scaled up proportionately -->
  <g transform="translate(20.5, 23.5) scale(1.2)">
    <!-- Main building outline - flat top modern apartment block -->
    <rect x="3" y="6" width="30" height="32" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Windows / Living Units Grid - Solid crisp white -->
    <rect x="8" y="11" width="5" height="5" rx="1.5" fill="#ffffff" />
    <rect x="16" y="11" width="5" height="5" rx="1.5" fill="#ffffff" />
    <rect x="23" y="11" width="5" height="5" rx="1.5" fill="#ffffff" />
    
    <rect x="8" y="20" width="5" height="5" rx="1.5" fill="#ffffff" />
    <rect x="16" y="20" width="5" height="5" rx="1.5" fill="#ffffff" />
    <rect x="23" y="20" width="5" height="5" rx="1.5" fill="#ffffff" />
    
    <!-- Doorway / Entryway -->
    <path d="M15 38V30C15 28.8954 15.8954 28 17 28H19C20.1046 28 21 28.8954 21 30V38" fill="#003732" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: Increased text size for RMS and Roommate Manager -->
  <text x="96" y="47" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#004D40">RMS</text>
  <text x="97.5" y="64" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#5F7572" text-transform="uppercase">Roommate Manager</text>

  <!-- Gradients and filters -->
  <defs>
    <linearGradient id="brandGrad" x1="6" y1="9" x2="78" y2="81" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00685F" />
      <stop offset="1" stop-color="#003732" />
    </linearGradient>
  </defs>
</svg>
